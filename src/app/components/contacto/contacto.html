<section>
    <div class="container">
        <div class="row">
            <div class="col s12 center-align">
                <h2>Contactanos</h2>
            </div>
        </div>

        <div class="row">
            <div class="col s12 input-field">
                <input type="text" name="nombre" id="nombre">
                <label for="nombre"> {{ nombre }}</label>
            </div>
        </div>

        <div class="row">
            <div class="col s12 input-field">
                <input type="email" name="email" id="email">
                <label for="email"> {{ email }}</label>
            </div>
        </div>

        <div class="row">
            <div class="col s12 input-field">
                <input type="number" name="telefono" id="telefono">
                <label for="telefono"> {{ telefono }}</label>
            </div>
        </div>

        <div class="row">
            <div class="col s12 input-field">
                <input type="date" name="fecha" id="fecha">
                <label for="fecha">{{ fecha }}</label>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <label>Modalidad de entrega</label>
                <ul>
                    <li><label for=""><input type="radio" name="modalidad"><span>Recoger en sucursal</span></label></li>
                    <li><label for=""><input type="radio" name="modalidad"><span>Entregar a domicilio</span></label>
                    </li>
                    <li><label for=""><input type="radio" name="modalidad"><span>Plataforma de envio</span></label></li>
                </ul>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <label>Selecciona el tipo de producto</label>
                <select name="tipoProducto" id="">
                    <option value="">[ Opciones ]</option>
                    <option value="pasteles">Pasteles</option>
                    <option value="galletas">Galletas</option>
                    <option value="bolillos">Bolillos</option>
                    <option value="hotcakes">Hotcakes</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <label>Selecciona tus complementos</label>
                <ul>
                    <li><label for=""><input type="checkbox" value="velasDePastel" name="complementos"><span>Velas de pastel</span></label></li>
                    <li><label for=""><input type="checkbox" value="figuraDecorativa" name="complementos"><span>Figura decorativa</span></label></li>
                    <li><label for=""><input type="checkbox" value="bolsaEcologica" name="complementos"><span>Bolsa ecologica</span></label></li>
                </ul>
            </div>
        </div>

        <div class="row">
            <div class="col s12 input-field">
                <textarea name="comentarios" id="comentarios" class="materialize-textarea"></textarea>
                <label for="comentarios">Detalles del pedido</label>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <p>Aceptas el avisiso de privacidad</p>
                <div class="switch">
                    <label for="">
                        No
                        <input type="checkbox" name="" id="">
                        <span class="lever"></span>
                        Si
                    </label>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12 center-align">
                <input type="button" value="Cancelar" class="btn brown lighten-2">
                <input type="button" value="Guardar" class="btn">
            </div>
        </div>

    </div>
</section>
