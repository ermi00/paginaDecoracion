<section>
    <div class="container">
        <div class="row">
            <div class="col s12">
                <h2 class="center-align">{{ titulo }}</h2>
            </div>
        </div>

        <div class="row">
            <div class="col m6" *ngFor="let elemento of misionVision">
                <h5>{{ elemento.titulo }}</h5>
                <i class="material-icons"> {{ elemento.icono }}</i>
                <p> {{ elemento.descripcion }}</p>
            </div>
        </div>
    </div>
</section>
